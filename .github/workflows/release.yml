name: Release

# Push a tag like v0.2.0 (or run manually) to build a universal app and publish
# DiskFerry-<version>.dmg / .zip on a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v, e.g. 0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install rclone
        run: brew install rclone

      - name: Test
        run: swift test

      - name: Package
        run: ./script/package_release.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - name: Release notes
        run: ./script/release_notes.sh "${{ steps.version.outputs.version }}" > dist/release/NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiskFerry-${{ steps.version.outputs.version }}
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" \
            dist/release/DiskFerry-"$VERSION".dmg \
            dist/release/DiskFerry-"$VERSION".zip \
            dist/release/SHA256SUMS.txt \
            --title "Disk Ferry $VERSION" \
            --notes-file dist/release/NOTES.md \
            --target "$GITHUB_SHA" \
            "${flags[@]}"
